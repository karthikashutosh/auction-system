services:
  postgres:
    # pgvector build of Postgres 17 (migration 005 needs the "vector" extension).
    # MUST be the -trixie tag: it matches the glibc of the official postgres:17 image the existing data
    # volume was created with. The plain pg17 tag is Debian 12 (older glibc): Postgres then reports a
    # collation version mismatch and text indexes (e.g. unique emails) can silently misbehave.
    image: pgvector/pgvector:pg17-trixie
    container_name: auction-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: karthikselvam
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auction_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  api:
    image: ghcr.io/karthikashutosh/auction-api:latest

    container_name: auction-api
    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    env_file:
      - ./apps/api/.env.production

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8001

    ports:
      - "3001:3001"

  worker:
    image: ghcr.io/karthikashutosh/auction-worker:latest

    container_name: auction-worker
    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    env_file:
      - ./apps/api/.env.production

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8001

  # Python AI service. READ-ONLY database role; never exposed publicly (no ports published).
  # services/ai-service/.env.production must define DATABASE_URL (with a ROTATED ai_service
  # password: run `ALTER ROLE ai_service PASSWORD '...'` after migrations, the migration
  # ships a dev password), AI_PROVIDER and AI_API_KEY.
  ai-service:
    image: ghcr.io/karthikashutosh/auction-ai-service:latest

    container_name: auction-ai-service
    restart: unless-stopped

    depends_on:
      - postgres

    # Optional on purpose: if this file is missing, only the AI service fails to boot (search then
    # returns a clean 503) instead of `docker compose up` failing for every service.
    env_file:
      - path: ./services/ai-service/.env.production
        required: false

    environment:
      ENVIRONMENT: production

  web:
    image: ghcr.io/karthikashutosh/auction-web:latest

    container_name: auction-web
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "3000:3000"

volumes:
  postgres_data:
