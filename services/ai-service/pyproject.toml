[project]
name = "ai-service"
version = "0.1.0"
description = "AI service for the auction system (read-only against Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "langgraph>=0.2",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_any_explicit = false
warn_return_any = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
