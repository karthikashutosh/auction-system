services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: auction-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: karthikselvam
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auction_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    container_name: auction-api
    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    env_file:
      - ./apps/api/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8001

    ports:
      - "3001:3001"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile

    container_name: auction-worker
    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    env_file:
      - ./apps/worker/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8001

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}

    container_name: auction-web
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "3000:3000"

  ai-service:
    build:
      context: ./services/ai-service

    container_name: auction-ai-service
    restart: unless-stopped

    depends_on:
      - postgres

    env_file:
      - path: ./services/ai-service/.env
        required: false

    environment:
      ENVIRONMENT: development
      # Read-only role created by migration 006.
      DATABASE_URL: postgresql://ai_service:ai_service_dev@postgres:5432/auction_db

    ports:
      - "8001:8001"

  # Optional tracing UI: docker compose --profile tracing up  (then set OTEL_ENABLED=true and
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 on ai-service; UI at http://localhost:16686)
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    container_name: auction-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  postgres_data:
